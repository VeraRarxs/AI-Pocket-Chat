name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK/cmdline-tools" ]; then
            BIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          else
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmd.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            BIN="$SDK/cmdline-tools/latest/bin"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "SDK=$SDK  BIN=$BIN"
          yes | "$BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$BIN/sdkmanager" "platforms;android-37.0" > /dev/null 2>&1 || true
          "$BIN/sdkmanager" "platforms;android-37" > /dev/null 2>&1 || true
          echo "--- platforms 目录"; ls "$SDK/platforms" || true
          rm -f local.properties

      - name: 编译 debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          RC=$?
          echo "gradle exit=$RC"
          if [ $RC -ne 0 ]; then
            MSG=$(tr '\r' '\n' < /tmp/build.log | grep -vE '^[[:space:]]*$' | tail -14 | tr '\n' '|' | head -c 1000)
            echo "::error::$MSG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-Pocket-Chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
